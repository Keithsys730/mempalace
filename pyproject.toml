[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mempalace"
version = "0.1.0"
description = "Hierarchical Multi-Agent Memory Palace & Process Supervision Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Keith", email = "Keithsys730@users.noreply.github.com" }]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "filelock>=3.12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
mempalace = "mempalace.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
